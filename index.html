<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intermedia Job Tracker</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#F6F7FB;
    --surface:#FFFFFF;
    --surface-2:#EEF0F6;
    --surface-sunken:#E8EAF1;
    --border:#DEE2EB;
    --ink:#121E34;
    --ink-2:#47506B;
    --ink-3:#7A8399;
    --accent:#E97132;
    --accent-ink:#121E34;
    --accent-soft:#FCE9DA;
    --accent-strong:#A8501C;
    --progress:#2E6FA3; --progress-soft:#E3EEF7;
    --good:#2F9E58; --good-soft:#E4F5EA;
    --warn:#93791A; --warn-soft:#F1ECD2;
    --critical:#D1495B; --critical-soft:#FBE4E8;
    --violet:#8B5FBF; --violet-soft:#F0E9F8;
    --neutral:#7A8399; --neutral-soft:#EAEDF3;
    --shadow-sm: 0 1px 2px rgba(18,30,52,.06), 0 1px 1px rgba(18,30,52,.04);
    --shadow-md: 0 8px 24px rgba(18,30,52,.12), 0 2px 6px rgba(18,30,52,.06);
    --shadow-lg: 0 20px 48px rgba(18,30,52,.22), 0 4px 12px rgba(18,30,52,.10);
    --radius-sm:8px; --radius-md:12px; --radius-lg:16px;
    --brand-navy:#121E34;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E1524;
      --surface:#161E30;
      --surface-2:#1D2740;
      --surface-sunken:#0B1120;
      --border:#2A3552;
      --ink:#EAF0FB;
      --ink-2:#B7C1D9;
      --ink-3:#8290AC;
      --accent:#F0885A;
      --accent-ink:#121E34;
      --accent-soft:#3A2A1E;
      --accent-strong:#F5B085;
      --progress:#5B9BD1; --progress-soft:#1E3550;
      --good:#4CBE7C; --good-soft:#163326;
      --warn:#C9AE4A; --warn-soft:#332C12;
      --critical:#E37085; --critical-soft:#3A1620;
      --violet:#B08EE0; --violet-soft:#2A2140;
      --neutral:#8290AC; --neutral-soft:#212B44;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.30);
      --shadow-md: 0 8px 24px rgba(0,0,0,.40);
      --shadow-lg: 0 20px 48px rgba(0,0,0,.55);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1524;
    --surface:#161E30;
    --surface-2:#1D2740;
    --surface-sunken:#0B1120;
    --border:#2A3552;
    --ink:#EAF0FB;
    --ink-2:#B7C1D9;
    --ink-3:#8290AC;
    --accent:#F0885A;
    --accent-ink:#121E34;
    --accent-soft:#3A2A1E;
    --accent-strong:#F5B085;
    --progress:#5B9BD1; --progress-soft:#1E3550;
    --good:#4CBE7C; --good-soft:#163326;
    --warn:#C9AE4A; --warn-soft:#332C12;
    --critical:#E37085; --critical-soft:#3A1620;
    --violet:#B08EE0; --violet-soft:#2A2140;
    --neutral:#8290AC; --neutral-soft:#212B44;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.30);
    --shadow-md: 0 8px 24px rgba(0,0,0,.40);
    --shadow-lg: 0 20px 48px rgba(0,0,0,.55);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.font-display{
    font-family:"Sora","IBM Plex Sans",sans-serif;
    text-wrap:balance;
    letter-spacing:-0.01em;
  }
  .mono, .tabular, time, .num{
    font-family:"IBM Plex Mono", ui-monospace, monospace;
    font-variant-numeric:tabular-nums;
  }
  a{color:var(--accent);}
  button{font-family:inherit;}
  ::selection{background:var(--accent-soft);}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;}
  }

  /* ---------- App shell ---------- */
  #app-root{min-height:100vh;}
  .app-loading{
    display:flex; align-items:center; justify-content:center; min-height:100vh;
    color:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:13px; letter-spacing:.04em;
  }
  .app-fatal{
    display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px;
  }
  .app-fatal-box{
    max-width:480px; background:var(--surface); border:1px solid var(--critical); border-radius:14px;
    padding:22px 24px; color:var(--ink);
  }
  .app-fatal-box h2{margin:0 0 8px; font-size:16px; color:var(--critical);}
  .app-fatal-box p{margin:0 0 8px; font-size:13px; color:var(--ink-2);}
  .app-fatal-box code{background:var(--surface-sunken); padding:1px 5px; border-radius:5px; font-size:12px;}

  .topbar{
    position:sticky; top:0; z-index:40;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    box-shadow:var(--shadow-sm);
  }
  .topbar-inner{
    max-width:1760px; margin:0 auto; padding:14px 24px;
    display:flex; align-items:center; gap:20px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:12px; margin-right:auto;}
  .brand-mark{
    width:36px;height:36px;border-radius:9px;
    background:linear-gradient(155deg, var(--ink) 0%, var(--accent) 130%);
    display:flex;align-items:center;justify-content:center;
    color:#fff; font-family:"Sora",sans-serif; font-weight:700; font-size:14px;
    flex:none; overflow:hidden;
  }
  .brand-mark.has-logo{
    width:auto; height:56px; padding:8px 14px; border-radius:10px;
    background:var(--brand-navy); background-image:none;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
  }
  .brand-mark.has-logo img{height:100%; width:auto; object-fit:contain; display:block;}
  .brand-text h1{font-size:16px;margin:0;font-weight:600;color:var(--ink);}
  .brand-text span{display:block;font-size:9.5px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;margin-top:2px;}

  .tabs{display:flex; gap:4px; background:var(--surface-2); padding:4px; border-radius:10px;}
  .tab-btn{
    appearance:none;border:0;background:transparent;color:var(--ink-2);
    font-size:13px;font-weight:500;padding:7px 14px;border-radius:8px;cursor:pointer;
    transition:background .15s,color .15s;
  }
  .tab-btn[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm);}
  .tab-btn:hover:not([aria-selected="true"]){color:var(--ink);}

  .lockbtn{
    appearance:none; border:1px solid var(--border); background:var(--surface);
    color:var(--ink-2); font-size:12.5px; font-weight:500; padding:7px 12px;
    border-radius:8px; cursor:pointer; display:flex; align-items:center; gap:6px;
    transition:border-color .15s, color .15s;
  }
  .lockbtn:hover{border-color:var(--accent); color:var(--accent);}
  .lockbtn.unlocked{border-color:var(--good); color:var(--good); background:var(--good-soft);}
  .lockbtn.unlocked.tracking{border-color:var(--progress); color:var(--progress); background:var(--progress-soft);}

.main-wrap{max-width:1760px;margin:0 auto;padding:18px 16px 80px;}
@media (min-width: 881px){
  .main-wrap{padding-right:268px;}
  .main-wrap.no-widget{padding-right:16px;}
}

  .toolrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .search-box{
    flex:1 1 240px; max-width:360px; position:relative;
  }
  .search-box input{
    width:100%; padding:8px 12px 8px 32px; border-radius:9px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink); font-size:13px;
  }
  .search-box input:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .search-box svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--ink-3);}

  select, .select{
    padding:8px 10px; border-radius:9px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink); font-size:13px;
  }
  select:focus{outline:2px solid var(--accent); outline-offset:1px;}

  .btn{
    appearance:none; border:1px solid var(--border); background:var(--surface); color:var(--ink);
    font-size:13px; font-weight:500; padding:8px 14px; border-radius:9px; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px; transition:filter .15s, background .15s;
  }
  .btn:hover{filter:brightness(0.97);}
  :root[data-theme="dark"] .btn:hover, @media (prefers-color-scheme:dark){ .btn:hover{filter:brightness(1.15);} }
  .btn-primary{background:var(--accent); color:var(--accent-ink); border-color:transparent;}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-ghost{border-color:transparent; background:transparent;}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn-sm{padding:5px 10px; font-size:12px; border-radius:7px;}
  .btn-danger{color:var(--critical); border-color:var(--critical);}
  .btn-danger:hover{background:var(--critical-soft);}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .btn:focus-visible, select:focus-visible, input:focus-visible, .tab-btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  .checkline{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);user-select:none;}

  /* ---------- Table ---------- */
  .table-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
    box-shadow:var(--shadow-sm); overflow:hidden;
  }
  .table-scroll{overflow-x:auto;}
  table.tix{width:100%; border-collapse:collapse; table-layout:auto;}
  table.tix thead th{
    position:sticky; top:0; background:var(--surface-2); z-index:2;
    text-align:left; font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.03em;
    color:var(--ink-3); padding:7px 6px; border-bottom:1px solid var(--border);
  }
  table.tix tbody td{
    padding:7px 6px; border-bottom:1px solid var(--border); vertical-align:top; font-size:12px; color:var(--ink);
  }
  table.tix tbody tr:last-child td{border-bottom:none;}
  table.tix tbody tr:hover{background:var(--surface-2);}
  table.tix tbody tr.is-historical{opacity:.72;}
  .cell-ticket{max-width:158px;}
  .cell-ticket .t-name{font-weight:500; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .cell-ticket a.t-name{color:var(--ink);}
  .cell-ticket a.t-name:hover{color:var(--accent);}
  .linklet{
    display:inline-flex; align-items:center; gap:3px; font-size:11px; padding:3px 6px;
    border-radius:6px; background:var(--accent-soft); color:var(--accent-strong); text-decoration:none; white-space:nowrap;
    max-width:104px; overflow:hidden; text-overflow:ellipsis;
  }
  .linklet:hover{filter:brightness(0.95);}
  .linklet.empty{background:transparent; color:var(--ink-3); border:0; padding:3px 0;}
  .req-name{color:var(--ink-2); max-width:82px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  td.num, td.datecell{white-space:nowrap; font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-2);}
  .datecell .needed{display:block;color:var(--ink-3);font-size:10.5px;}

  .time-used{display:flex; flex-direction:column; gap:2px; font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-2); white-space:nowrap;}
  .time-used span{display:flex; gap:5px; align-items:center;}
  .time-used span i{font-style:normal; color:var(--ink-3); width:16px; flex:none;}
  .time-used span b{color:var(--ink); font-weight:600;}
  .time-used .tu-empty{color:var(--ink-3);}
  .time-used-track .tu-dev-edit{background:var(--progress-soft); border-radius:5px; padding:1px 4px 1px 5px; margin:1px 0;}
  .time-used-track .tu-dev-edit i{color:var(--progress);}
  input.dev-time-input{
    appearance:none; -webkit-appearance:none; border:1px solid transparent; background:transparent;
    color:var(--progress); font-family:"IBM Plex Mono",monospace; font-size:11px; font-weight:700;
    width:44px; padding:1px 2px; border-radius:4px;
  }
  input.dev-time-input:hover{border-color:var(--progress);}
  input.dev-time-input:focus{outline:none; border-color:var(--progress); background:var(--surface);}

  .badge{
    display:inline-flex; align-items:center; gap:5px; padding:4px 9px; border-radius:99px;
    font-size:11px; font-weight:600; white-space:nowrap; border:1px solid transparent;
  }
  .badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
  .status-wrap{position:relative; display:inline-block;}
  select.status-select{
    appearance:none; -webkit-appearance:none; border:1px solid transparent; font-size:10.5px; font-weight:600; padding:4px 19px 4px 8px;
    border-radius:99px; cursor:pointer; max-width:112px; text-overflow:ellipsis;
  }
  .status-wrap .chevron{position:absolute; right:7px; top:50%; transform:translateY(-50%); pointer-events:none; opacity:.65;}

  .assignee{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-2); white-space:nowrap;}
  .assignee .avatar{
    width:19px;height:19px;border-radius:50%;background:var(--progress-soft);color:var(--progress);
    display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;flex:none;
    font-family:"Sora",sans-serif;
  }
  .assignee.unassigned{color:var(--ink-3); font-style:italic;}
  .assignee.unassigned .avatar{background:var(--surface-sunken); color:var(--ink-3);}
  .assignee-wrap{position:relative; display:inline-block;}
  select.assignee-select{
    appearance:none; -webkit-appearance:none; border:1px solid var(--border); background:var(--surface); color:var(--ink);
    font-size:11.5px; padding:4px 18px 4px 7px; border-radius:7px; cursor:pointer; max-width:96px;
  }
  .assignee-wrap .chevron{position:absolute; right:6px; top:50%; transform:translateY(-50%); pointer-events:none; opacity:.55; color:var(--ink-3);}

  .row-actions{display:flex; gap:4px; opacity:0; transition:opacity .1s;}
  table.tix tbody tr:hover .row-actions{opacity:1;}
  .iconbtn{
    appearance:none;border:0;background:transparent;color:var(--ink-3);padding:5px;border-radius:6px;cursor:pointer;
    display:flex;
  }
  .iconbtn:hover{background:var(--surface-sunken); color:var(--ink);}

  .empty-state{padding:48px 24px; text-align:center; color:var(--ink-3);}
  .empty-state svg{margin-bottom:10px; opacity:.5;}

  .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 12px;}
  .section-head h2{font-size:15px;margin:0;color:var(--ink);}
  .section-head .count{color:var(--ink-3); font-size:12px; font-family:"IBM Plex Mono",monospace;}
  .section-sub{color:var(--ink-3); font-size:12.5px; margin:-6px 0 12px;}

  .pager{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;font-size:12.5px;color:var(--ink-2);}

  /* ---------- Sticky hours widget ---------- */
  .hours-widget{
    position:fixed; top:84px; right:16px; z-index:50; width:240px;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
    box-shadow:var(--shadow-lg); transition:transform .28s cubic-bezier(.2,.8,.3,1), width .28s, padding .2s;
    max-height:calc(100vh - 110px); overflow:auto;
  }
  .hours-widget .hw-head{
    display:flex; align-items:center; gap:8px; padding:14px 16px 10px;
  }
  .hours-widget .hw-head svg{color:var(--accent); flex:none;}
  .hours-widget .hw-head b{font-size:12.5px; font-weight:600; color:var(--ink); flex:1;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .hw-collapse-btn{appearance:none;border:0;background:transparent;color:var(--ink-3);cursor:pointer;padding:4px;border-radius:6px;display:flex;}
  .hw-collapse-btn:hover{background:var(--surface-2);}
  .hw-body{padding:0 16px 16px;}
  .hw-pool{margin-bottom:14px;}
  .hw-pool:last-child{margin-bottom:0;}
  .hw-pool-label{font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-3); margin-bottom:5px; display:flex; justify-content:space-between;}
  .hw-bar-track{height:8px;border-radius:99px;background:var(--surface-sunken);overflow:hidden;}
  .hw-bar-fill{height:100%;border-radius:99px;transition:width .4s ease;}
  .hw-nums{display:flex; justify-content:space-between; margin-top:5px; font-size:12px;}
  .hw-nums .rem{font-weight:600; font-family:"IBM Plex Mono",monospace;}
  .hw-nums .of{color:var(--ink-3); font-family:"IBM Plex Mono",monospace;}
  .hw-actions{display:flex; gap:8px; margin-top:12px;}
  .hw-actions .btn{flex:1; justify-content:center;}
  .hw-history-link{
    display:block; text-align:center; font-size:11.5px; color:var(--ink-3); margin-top:10px;
    cursor:pointer; background:none; border:0; width:100%; padding:4px;
  }
  .hw-history-link:hover{color:var(--accent);}

  .hours-widget.collapsed{
    width:auto; cursor:pointer;
  }
  .hours-widget.collapsed .hw-body{display:none;}
  .hours-widget.collapsed .hw-head{padding:9px 14px;}
  .hours-widget.collapsed .hw-head b{display:none;}
  .hw-pill-num{display:none; font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:12.5px;}
  .hours-widget.collapsed .hw-pill-num{display:inline;}

  @media (max-width: 880px){
    .hours-widget{position:static; width:auto; margin:0 0 18px; max-height:none; box-shadow:var(--shadow-sm);}
    .hours-widget.collapsed{width:auto;}
  }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(14,21,36,.45); z-index:100;
    display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; overflow-y:auto;
  }
  .modal{
    background:var(--surface); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg);
    width:100%; max-width:560px; padding:24px; border:1px solid var(--border);
  }
  .modal.modal-sm{max-width:400px;}
  .modal h3{margin:0 0 4px; font-size:16px;}
  .modal .modal-sub{color:var(--ink-3); font-size:12.5px; margin:0 0 18px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--ink-2); margin-bottom:5px;}
  .field input[type=text], .field input[type=date], .field input[type=number], .field input[type=password], .field input[type=url], .field select, .field textarea{
    width:100%; padding:9px 11px; border-radius:8px; border:1px solid var(--border); background:var(--surface);
    color:var(--ink); font-size:13.5px; font-family:inherit;
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .field-row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;}
  .field-hint{font-size:11.5px; color:var(--ink-3); margin-top:4px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:20px;}
  .modal-err{background:var(--critical-soft); color:var(--critical); border-radius:8px; padding:9px 12px; font-size:12.5px; margin-bottom:14px;}
  .pin-dots{display:flex; gap:10px; justify-content:center; margin:18px 0;}
  .pin-dots input{
    width:44px; height:52px; text-align:center; font-size:22px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink); font-family:"IBM Plex Mono",monospace;
  }
  .pin-dots input:focus{outline:2px solid var(--accent);}

  /* ---------- Toast ---------- */
  .toast-wrap{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center;}
  .toast{
    background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:9px; font-size:12.5px; box-shadow:var(--shadow-md);
    display:flex; align-items:center; gap:8px; animation:toast-in .18s ease;
  }
  .toast.toast-error{background:var(--critical);}
  .toast.toast-good{background:var(--good);}
  @keyframes toast-in{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .banner{
    display:flex; align-items:center; gap:10px; padding:10px 16px; border-radius:10px; font-size:12.5px;
    margin-bottom:16px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink-2);
  }
  .banner.banner-info{background:var(--accent-soft); color:var(--accent); border-color:transparent;}
  .banner.banner-error{background:var(--critical-soft); color:var(--critical); border-color:transparent;}

  .visually-hidden{position:absolute; width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

  .legacy-list{display:flex; flex-direction:column; gap:14px;}
  .legacy-pool{border:1px solid var(--border); border-radius:10px; padding:12px 14px;}
  .legacy-pool h4{margin:0 0 8px; font-size:12.5px; color:var(--ink-2);}
